name: Temporary SQLx lockfile generation

on:
  push:
    branches: ["feat/postgres-sqlx-foundation"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/postgres-sqlx-foundation
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate locked dependency graph
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git diff --cached --quiet || git commit -m "chore(deps): lock SQLx dependency graph"
          git push origin HEAD:feat/postgres-sqlx-foundation
