name: Generate dependency lockfiles

on:
  push:
    branches: ["chore/reproducible-builds-ci"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global npm@10.8.2
      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify frontend lockfile
        working-directory: frontend
        run: |
          npm ci
          npm ls --depth=0
          npm audit --audit-level=moderate
          npm run format:check
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Generate Rust lockfile
        run: cargo generate-lockfile
      - name: Verify Rust lockfile
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): add reproducible dependency lockfiles"
            git push
          fi
