name: Temporary format inspection

on:
  push:
    branches:
      - feat/client-auth-login-ui

jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Print formatted test files
        run: npx prettier src/app/ClientLoginPage.test.tsx src/app/identityApi.client.test.ts
