name: Temporary Rust Lockfile Resolver

on:
  push:
    branches: ["feat/registration-provider-integration"]
    paths:
      - "backend/Cargo.toml"
      - ".github/workflows/resolve-rust-lock.yml"

permissions:
  contents: write

jobs:
  resolve-lockfile:
    if: github.ref == 'refs/heads/feat/registration-provider-integration' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/registration-provider-integration
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve and validate workspace dependencies
        run: cargo check --workspace
      - name: Commit only the generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(deps): update Cargo.lock for FlowKirim HTTP client"
          git push origin "HEAD:${GITHUB_REF_NAME}"
