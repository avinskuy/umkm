name: Quality Checks

on:
  push:
    branches: ["main", "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@10.8.2
      - run: npm ci
      - name: Diagnose Admin API test formatting
        run: |
          npx prettier src/app/identityApi.test.ts > /tmp/identityApi.test.formatted.ts
          diff -u src/app/identityApi.test.ts /tmp/identityApi.test.formatted.ts || true
      - run: npm ls --depth=0
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: usahapintar_ci_admin
          POSTGRES_PASSWORD: ci_admin_only_password
          POSTGRES_DB: usahapintar_ci_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usahapintar_ci_admin -d usahapintar_ci_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://usahapintar_migrator:ci_migrator_only_password@localhost:5432/usahapintar_test
      APP_DATABASE_URL: postgres://usahapintar_app_login:ci_app_only_password@localhost:5432/usahapintar_test
      CI_ADMIN_DATABASE_URL: postgres://usahapintar_ci_admin:ci_admin_only_password@localhost:5432/usahapintar_ci_admin
      CI_TARGET_ADMIN_DATABASE_URL: postgres://usahapintar_ci_admin:ci_admin_only_password@localhost:5432/usahapintar_test
    steps:
      - uses: actions/checkout@v4
      - name: Provision disposable PostgreSQL principals
        run: |
          psql "$CI_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE usahapintar_test OWNER usahapintar_ci_admin"
          psql "postgres://usahapintar_ci_admin:ci_admin_only_password@localhost:5432/usahapintar_test" \
            -v ON_ERROR_STOP=1 -f backend/database/bootstrap/001_create_principals.sql
          psql "postgres://usahapintar_ci_admin:ci_admin_only_password@localhost:5432/usahapintar_test" \
            -v ON_ERROR_STOP=1 -f backend/database/bootstrap/001_create_principals.sql
          psql "$CI_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER ROLE usahapintar_migrator PASSWORD 'ci_migrator_only_password';
          ALTER ROLE usahapintar_app_login PASSWORD 'ci_app_only_password';
          ALTER ROLE usahapintar_backup_login PASSWORD 'ci_backup_only_password';
          ALTER ROLE usahapintar_monitor_login PASSWORD 'ci_monitor_only_password';
          SQL
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --locked -p usahapintar-api --test postgres -- --ignored
      - run: cargo test --locked -p usahapintar-api --test runtime -- --ignored
      - run: cargo build --workspace --locked
